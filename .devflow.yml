# devflow 项目配置（草稿，关口 A 请确认）
context: |
  vibe-remote：远程 Claude 终端桌面工具。
  daemon：Go 1.26（vibe-remoted/），REST + WebSocket + PTY/tmux 会话生命周期。
  桌面端：Electron + 原生 TypeScript（无前端框架）+ xterm.js（desktop/）。
  终端模式是纯字节透传：客户端绝不解析 PTY 输出，tmux 是会话的唯一事实来源。
  对话模式（只支持 claude）：daemon 持有 claude 的 stream-json 进程，客户端渲染结构化消息。
  协议三处必须手动保持一致：vibe-remoted/internal/protocol/protocol.go、
  desktop/src/shared/protocol.ts（含 rest.ts）、docs/protocol.md；改协议用 /protocol-sync 核对。
  新增错误路径要选对 error.fatal；PTY 生命周期改动要保持 go test -race 通过。
  界面文案中英双语（i18n parity 测试守着）；文档用简体中文。

docs_dir: docs/changes
autonomy: L1

commands:
  install: cd desktop && npm ci
  lint: make check          # gofmt + go vet + tsc，均在 make check 内
  test: make check
  build: make server && cd desktop && npm run build
  e2e: node .claude/skills/verify/scripts/gui-smoke.mjs

environments:
  local:
    start: make dev-server
    url_env: VIBE_REMOTE_LOCAL_URL
    default_url: http://localhost:8765
    data: 可随意

test:
  e2e_env: local
  verify_env: local
  cloud_browser: forbidden

human_decisions:
  - 协议版本号变更与破坏兼容的帧改动
  - CLAUDE.md 架构约束的改写
  - 发布 tag

invariants:
  - rule: 终端模式纯字节透传，客户端不解析 PTY 输出
    check: cd desktop && npm test
  - rule: 协议在 protocol.go / protocol.ts / docs/protocol.md 三处一致
    check: /protocol-sync skill
  # 双模式会话（docs/changes/2026-11-13-dual-mode，design 7.1；c2 已确认）
  - rule: 终端会话的 v2 帧除 proto 外逐字节不变
    check: cd vibe-remoted && go test -race ./internal/server -run TestTerminalFramesUnchangedV3
  - rule: 同一 claude 会话 id 任何时刻最多一个 claude 进程（claudeOwners 先 claim 后 spawn；continue 终端会话固定身份后 claim）
    check: cd vibe-remoted && go test -race ./internal/chat -run 'TestSingleProcess|TestOrphanCleanup' && go test -race ./internal/session ./internal/server -run 'TestReloadWaitsForOldProcess|TestChatCreateReplaySameID|TestContinueReusesRunningSession|TestConcurrentContinueCreatesOneProcess|TestRestartRefusedWhenUResumedElsewhere|TestHandoffVsReloadOneWins|TestReloadVsDeleteSerialized|TestTerminalContinueBusyWhenChatOwns|TestTerminalContinueClaimsLatest'
  - rule: 客户端断开不停对话进程、不发 exit
    check: cd vibe-remoted && go test -race ./internal/server -run TestChatDisconnectKeepsProcess
  - rule: 待答请求只因回答/取消/中断/退出而消失，不被缓冲淘汰
    check: cd vibe-remoted && go test -race ./internal/chat -run TestPendingSurvivesRingEviction
  - rule: 「不再询问」规则只能来自 claude 的建议
    check: cd vibe-remoted && go test -race ./internal/chat -run TestRespondRejectsForeignRule
  - rule: 启动命令只由服务端配置拼成，客户端只传 id
    check: cd vibe-remoted && go test ./internal/chat -run TestCommandFromConfigOnly && go test ./internal/server -run TestAttachIgnoresCommandFields
  - rule: 模型输出不以原始 HTML 进入 DOM；chat/ 下只有 markdown.ts 写 innerHTML
    check: cd desktop && npm run test:chat-markdown && npm run test:chat-render-guard
  - rule: 主 token 不进 claude 环境（对话进程同样只有 hook token）
    check: cd vibe-remoted && go test ./internal/session -run TestChatEnvHookTokenOnly
  - rule: 不读取 claude 凭据
    check: cd vibe-remoted && go test ./internal/chat -run TestNoCredentialAccess
  # 按项目和 worktree 组织会话（docs/changes/2026-11-16-project-worktrees，design 7.1；c3 已确认）
  # 这几条会起 tmux：一律带独立的 TMUX_TMPDIR，不和本机正在用的 tmux -L vibe-remote 共用 socket
  - rule: 删会话不删 worktree 目录和分支，协议 4 的 daemon 不返回 worktree_preserved
    check: cd vibe-remoted && TMUX_TMPDIR=$(mktemp -d) go test -race -timeout 10m ./internal/session ./internal/server -run 'TestDeleteSessionKeepsWorktreeAndBranch|TestDeleteSessionNeverReturnsPreserved'
  - rule: 只删 daemon 自己读到的、在 allowed_roots 内的、不是主目录的 worktree
    check: cd vibe-remoted && TMUX_TMPDIR=$(mktemp -d) go test -race -timeout 10m ./internal/session ./internal/server -run 'TestRemoveOnlyListedWorktrees|TestRemoveMainRefused|TestListWorktreesPathWithNewline|TestListWorktreesFallsBackWithoutZ|TestParseWorktreeList'
  - rule: 不是 vibe-remote 创建的 worktree，分支永远不删
    check: cd vibe-remoted && TMUX_TMPDIR=$(mktemp -d) go test -race -timeout 10m ./internal/session -run 'TestRemoveExternalNeverDeletesBranch|TestManagedRequiresPathAndBranch'
  - rule: 未经同意不丢文件和提交（删除前重查，结束会话之后重读它在 git 列表里的那一项，HEAD、分支、是否 detached 有一样与确认的不一致就 409，含确认之后、结束会话期间分支被切换（即使提交没变）；里面嵌着别的 worktree、子模块或嵌入式仓库的检出、未被跟踪的独立仓库时拒绝删除；会话表没能和 tmux 对上时不动手——拿不准有没有 tmux 会话就算没对上：tmux 的 socket 文件不存在且 daemon 的会话表里没有终端会话时才算没有终端会话，有没有 tmux 程序都一样；socket 文件不见了而表里还有终端会话、找不到 tmux 程序而 socket 文件还在、tmux 的回答里有一条记录读不了，都算没对上；tmux 的报错只有整句是「没有 server / 没有会话」才算没有会话，socket 路径里出现这几个词不算；目录名里的制表符和换行不改变读到的归属；创建时的工作目录在其中的会话不管归属在哪都算进去，不看进程现在在哪；每结束一个终端会话都再读一次 tmux，读不到或它还在就不删目录，也不把它报成已结束）
    check: cd vibe-remoted && TMUX_TMPDIR=$(mktemp -d) go test -race -timeout 10m ./internal/session -run 'TestRemoveDirtyNeedsConsent|TestRemoveUnmergedNeedsConsent|TestRemoveWorktreeStopsWhenASessionDidNotEnd|TestRemoveWorktreeConfirmsSessionsAgainstTmux|TestSessionWhoseProcessIsInAnOddlyNamedDirectoryIsStillRead|TestSessionCreatedInAnOddlyNamedDirectoryIsStillRead|TestTmuxReadFailsWhenARecordDoesNotParse|TestRemoveChangedSinceStatus|TestRemoveHeadMovedWhileEndingSessions|TestRemoveRefusedWhenNestedWorktree|TestRemoveSubmoduleCheckoutRefused|TestRemoveUntrackedRepositoryRefused|TestRemoveBranchSwitchedAfterConfirmation|TestRemoveBranchSwitchedWhileEndingSessions|TestRemoveEndsSessionsAttributedElsewhere|TestRemoveWorktreeAfterRestartNeedsTheSessionsFromTmux|TestRemoveWorktreeRefusedWhenTmuxSocketDoesNotAnswer|TestSessionsOfAWorktreeGoByWhereTheyWereCreatedAcrossRestart|TestSocketFileGoneWhileTheTmuxServerRuns|TestMissingSocketIsNotAnEmptySetWhileTheTableHasTerminalSessions|TestRemoveWorktreeRefusedWhenTmuxIsNotOnPathButItsSocketIsThere|TestNoTmuxProgramIsAnEmptySetOnlyWithoutSocketAndWithoutTerminalSessions|TestTmuxSocketPathResolvesTheDirectoryLikeTmux|TestIsNoTmuxServerGoesByTheWholeLine|TestSocketPathSayingNoSessionsIsNotAnEmptySet'
  - rule: 客户端传的 worktree 名字不经 shell；新建会话时本地规则不通过的名字在任何 git 调用之前被拒，预检时这样的名字不进入任何 git 参数
    check: cd vibe-remoted && TMUX_TMPDIR=$(mktemp -d) go test -race -timeout 10m ./internal/session ./internal/server -run 'TestWorktreeNameNeverReachesShell|TestValidateWorktreeName|TestCreateRefusesBadWorktreeNameBeforeAnyGit|TestAttachRefusesBadWorktreeNameBeforeAnyGit'
  - rule: 对话界面的信任只认目录本身，或「仓库自己列出的 worktree 根 + 主目录这一个路径被信任」（git 不认 worktree list -z、列表按行读时，路径带换行的 worktree 被拆出来的任何一段都不算仓库列出的）
    check: cd vibe-remoted && TMUX_TMPDIR=$(mktemp -d) go test -race -timeout 10m ./internal/session -run 'TestChatTrust|TestFallbackListNeverInventsAWorktree|TestFallbackListFailsWhenTheMainDirectoryCannotBeRead|TestParseWorktreeListByLine'
  - rule: daemon 交给 git 的分支只写成完整引用名 refs/heads/<名字>，不调用 git branch、不用 -b / -B；撤销创建只清本次建出来的目录和分支（自己的 git worktree add 还没运行或自己放弃时，该路径上登记的 worktree 一律不删；它以非零退出而留下 worktree 时（post-checkout 钩子失败），只认领 add 之前没有、指向本次目录的那一条登记，add 之前就在的、add 以 128 退出时出现的都不删；分支被留下来的 worktree 检出时不删）
    check: cd vibe-remoted && TMUX_TMPDIR=$(mktemp -d) go test -race -timeout 10m ./internal/session -run 'TestGitNeverGetsShortBranchName|TestValidateWorktreeNameRejectsExpansion|TestUndoOnlyRemovesOwnArtifacts|TestUndoLeavesAWorktreeSomeoneElseAddedAtTheSamePath|TestUndoAfterWorktreeAddFailedOnItsOwn|TestWorktreeAddKilledDuringCheckoutIsUndone|TestRemoveDeletesBranchByFullRef|TestCreateFailedByPostCheckoutHookLeavesNothing|TestUndoLeavesAWorktreeSomeoneElseAddedWhileTheAddRan'
  - rule: daemon 运行的 git 不运行 core.fsmonitor 指定的程序（查看状态、预检、被拒绝的删除请求的检查都不运行它；每条 git 命令行以 -c core.fsmonitor=false 开头，git 2.31 之前的版本也认。clean / smudge 过滤器和 hook 是 git 自己的行为，不在这条规则内）
    check: cd vibe-remoted && TMUX_TMPDIR=$(mktemp -d) go test -race -timeout 10m ./internal/session -run 'TestReadOnlyGitRunsNoRepositoryProgram|TestCreateAndRemoveWorktreeDoNotRunFsmonitor|TestGitEnvKeepsInheritedConfig|TestDirtyFilesDoesNotRunFsmonitor|TestFsmonitorStaysOffOnGitWithoutConfigEnvironment|TestEveryGitCallTurnsFsmonitorOff'

rules:
  requirements: []
  design: []
  build: []
  test: []

release:
  bump: minor
  tag_prefix: v
  publish: "使用 /release {version}（走 PR，不直推 main）"
  production: "无（桌面 app 由用户自行下载 DMG）"
  post_check: "GitHub Release 页面有 arm64/x64 DMG 且 CI 绿"
