<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src http: ws:; img-src 'self' data:; font-src 'self' data:"
  />
  <title>vibe-remote</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar: machines & sessions -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>vibe-remote</h1>
        <div class="sidebar-header-actions">
          <button id="btn-lang" class="icon-btn" type="button" title="Switch language" aria-label="Switch language">中</button>
          <button id="btn-manage-machines" class="icon-btn" type="button" title="Manage machines" aria-label="Manage machines">⚙</button>
        </div>
      </div>
      <div id="machine-list" class="sidebar-content">
        <!-- Populated dynamically -->
      </div>
    </aside>

    <!-- Main terminal area -->
    <main id="main-area">
      <div id="toolbar">
        <div id="toolbar-title">vibe-remote</div>
        <div id="toolbar-status"><span id="toolbar-status-text"></span></div>
      </div>
      <div id="terminal-container">
        <div id="machine-overview" class="machine-overview" hidden></div>
      </div>
      <div id="status-bar">
        <span id="status-connection">Disconnected</span>
        <span id="status-session"></span>
      </div>
    </main>
  </div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
