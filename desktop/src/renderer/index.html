<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src http: ws:; img-src 'self' data:; font-src 'self' data:"
  />
  <title>vibe-remote</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar: machines & sessions -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 20 20">
              <path d="m5 6.25 3.5 3.75L5 13.75M10.5 13.75H15" />
            </svg>
          </span>
          <h1>vibe-remote</h1>
        </div>
        <div class="sidebar-header-actions">
          <button id="btn-lang" class="icon-btn" type="button" title="Switch language" aria-label="Switch language">中</button>
          <button id="btn-manage-machines" class="icon-btn" type="button" title="Manage machines" aria-label="Manage machines">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 6.75A3.25 3.25 0 1 0 10 13.25 3.25 3.25 0 0 0 10 6.75Z" />
              <path d="M16.1 11.25v-2.5l-1.72-.44a5.07 5.07 0 0 0-.54-1.3l.9-1.53-1.77-1.77-1.53.9a5.07 5.07 0 0 0-1.3-.54L9.7 2.35H7.2l-.44 1.72a5.07 5.07 0 0 0-1.3.54l-1.53-.9-1.77 1.77.9 1.53a5.07 5.07 0 0 0-.54 1.3L.8 8.75v2.5l1.72.44c.13.46.31.9.54 1.3l-.9 1.53 1.77 1.77 1.53-.9c.4.23.84.41 1.3.54l.44 1.72h2.5l.44-1.72c.46-.13.9-.31 1.3-.54l1.53.9 1.77-1.77-.9-1.53c.23-.4.41-.84.54-1.3l1.72-.44Z" />
            </svg>
          </button>
        </div>
      </div>
      <div id="machine-list" class="sidebar-content">
        <!-- Populated dynamically -->
      </div>
    </aside>

    <!-- Main terminal area -->
    <main id="main-area">
      <div id="toolbar">
        <div id="toolbar-title">vibe-remote</div>
        <div id="toolbar-status"><span id="toolbar-status-text"></span></div>
      </div>
      <div id="terminal-container">
        <div id="machine-overview" class="machine-overview" hidden></div>
      </div>
      <div id="status-bar" role="status" aria-live="polite" hidden>
        <span id="status-message"></span>
      </div>
    </main>
  </div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
